name: build

on:
  push:
    branches: [main, features]
  pull_request:
  workflow_dispatch:

permissions: {}
# Never cancel a main commit's run. PRs and features keep only their newest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.choose.outputs.base }}
      base_source: ${{ steps.choose.outputs.base_source }}
      mode: ${{ steps.choose.outputs.mode }}
      reason: ${{ steps.choose.outputs.reason }}
      tests: ${{ steps.choose.outputs.tests }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose tests
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: |
          if [ "$EVENT" = pull_request ]; then before=$BASE; else before=$BEFORE; fi
          python3 -B scripts/select-tests.py --event "$EVENT" --ref "$REF" --base "$before" --head "$HEAD" --repository "$REPOSITORY" --branch "${REF#refs/heads/}" --github-output "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-24.04
    needs: image-prep
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.package.outputs.manifest }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/download-artifact v6; only this run's validated candidate is accepted.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        if: needs.image-prep.outputs.mode == 'archive'
        with:
          name: candidate-image
          path: ${{ runner.temp }}
      - name: Verify the image for this revision
        id: image-id
        env:
          IMAGE_MODE: ${{ needs.image-prep.outputs.mode }}
          IMAGE_REF: ${{ needs.image-prep.outputs.ref }}
          IMAGE_SHA256: ${{ needs.image-prep.outputs.checksum }}
          IMAGE_ID: ${{ needs.image-prep.outputs.id }}
        run: |
          if [ "$IMAGE_MODE" = archive ]; then
            bash ci/image-job.sh receive
          elif [ "$IMAGE_MODE" = digest ]; then
            bash ci/image-job.sh fetch
          else
            echo 'No validated image for this revision' >&2
            exit 1
          fi
      - name: Build and package
        id: package
        env:
          RORTHOX_IMAGE_ID: ${{ steps.image-id.outputs.id }}
          RORTHOX_ACCEL: tcg
        run: |
          ./ci/run.sh make all iso
          mkdir -p build/ci
          ./ci/run.sh python3 -B scripts/ci-artifact.py create build/ci/production.tar.gz build/ci/production.sha256
          read -r manifest < build/ci/production.sha256
          cp build/ci/production.tar.gz "$RUNNER_TEMP/production.tar.gz"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      # actions/upload-artifact v6
      - name: Upload production build
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: production
          path: ${{ runner.temp }}/production.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: build-failure
          path: |
            bin/
            build/kernel.map
          if-no-files-found: ignore

  test:
    needs: [image-prep, build, select]
    if: ${{ !cancelled() && needs.image-prep.result == 'success' && needs.build.result == 'success' && needs.select.outputs.mode != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Enable the host KVM device if present
        timeout-minutes: 2
        run: |
          before=$(stat -c "%a %U %G" /dev/kvm 2>/dev/null || echo absent)
          # A failed device setup must not fail the shard or silently use KVM.
          if [ -c /dev/kvm ]; then
            failed=
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null || failed=udev-rule
            if [ -z "$failed" ]; then sudo udevadm control --reload-rules || failed=reload-rules; fi
            if [ -z "$failed" ]; then sudo udevadm trigger --name-match=kvm || failed=trigger; fi
            if [ -z "$failed" ]; then sudo udevadm settle --timeout=30 || failed=settle; fi
            if [ -n "$failed" ]; then
              echo "::warning title=KVM device setup::$failed failed; shard will use TCG"
              echo "RORTHOX_KVM_SETUP_FAILED=$failed failed" >> "$GITHUB_ENV"
            fi
          fi
          after=$(stat -c "%a %U %G" /dev/kvm 2>/dev/null || echo absent)
          bash ci/kvm-diagnostics.sh host "$before" "$after" || { echo '::warning title=KVM diagnostics::host diagnostics failed'; echo 'RORTHOX_KVM_SETUP_FAILED=host diagnostics failed' >> "$GITHUB_ENV"; }
      # actions/download-artifact v6; only this run's validated candidate is accepted.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        if: needs.image-prep.outputs.mode == 'archive'
        with:
          name: candidate-image
          path: ${{ runner.temp }}
      - name: Verify the image for this revision
        id: image-id
        env:
          IMAGE_MODE: ${{ needs.image-prep.outputs.mode }}
          IMAGE_REF: ${{ needs.image-prep.outputs.ref }}
          IMAGE_SHA256: ${{ needs.image-prep.outputs.checksum }}
          IMAGE_ID: ${{ needs.image-prep.outputs.id }}
        run: |
          if [ "$IMAGE_MODE" = archive ]; then
            bash ci/image-job.sh receive
          elif [ "$IMAGE_MODE" = digest ]; then
            bash ci/image-job.sh fetch
          else
            echo 'No validated image for this revision' >&2
            exit 1
          fi
      # actions/download-artifact v6; defaults to an artifact of this run.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: production
          path: ${{ runner.temp }}/production
      - name: Verify and test
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest }}
          SHARD: ${{ matrix.shard }}
          RORTHOX_REQUIRE_ISO: '1'
          RORTHOX_ACCEL: auto
          RORTHOX_IMAGE_ID: ${{ steps.image-id.outputs.id }}
          TEST_MODE: ${{ needs.select.outputs.mode }}
          SELECTED_TESTS: ${{ needs.select.outputs.tests }}
        run: |
          mkdir -p build/ci
          cp "$RUNNER_TEMP/production/production.tar.gz" build/ci/production.tar.gz
          ./ci/run.sh python3 -B scripts/ci-artifact.py extract build/ci/production.tar.gz "$MANIFEST_SHA256"
          if [ "$TEST_MODE" = subset ]; then
            read -r -a selected <<< "$SELECTED_TESTS"
            ./ci/run.sh ./scripts/run-tests.sh --shard "$SHARD/4" -j 2 --results "build/tests/runs/shard-$SHARD" "${selected[@]}"
          else
            # A missing or malformed selection never suppresses a test.
            ./ci/run.sh ./scripts/run-tests.sh --shard "$SHARD/4" -j 2 --results "build/tests/runs/shard-$SHARD"
          fi
      - name: Test TCG-only boot cases
        if: ${{ !cancelled() && matrix.shard == 1 && steps.image-id.outcome == 'success' }}
        env:
          RORTHOX_REQUIRE_ISO: '1'
          RORTHOX_ACCEL: tcg
          RORTHOX_IMAGE_ID: ${{ steps.image-id.outputs.id }}
          TEST_MODE: ${{ needs.select.outputs.mode }}
          SELECTED_TESTS: ${{ needs.select.outputs.tests }}
        run: |
          mapfile -t tcg_only < <(python3 -B scripts/tcg_only.py)
          if [ "$TEST_MODE" = subset ]; then
            filtered=()
            for t in "${tcg_only[@]}"; do
              [[ " $SELECTED_TESTS " != *" $t "* ]] || filtered+=("$t")
            done
            tcg_only=("${filtered[@]}")
            if [ "${#tcg_only[@]}" -eq 0 ]; then exit 0; fi
          fi
          test "${#tcg_only[@]}" -gt 0
          ./ci/run.sh ./scripts/run-tests.sh --results build/tests/runs/shard-1/tcg-only "${tcg_only[@]}"
      # Upload the reports and bounded failed-only evidence, even on a red shard.
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: results-${{ matrix.shard }}
          path: |
            build/tests/runs/shard-${{ matrix.shard }}/results.json
            build/tests/runs/shard-${{ matrix.shard }}/junit.xml
            build/tests/runs/shard-${{ matrix.shard }}/summary.md
            build/tests/runs/shard-${{ matrix.shard }}/failed/
            build/tests/runs/shard-${{ matrix.shard }}/tcg-only/results.json
            build/tests/runs/shard-${{ matrix.shard }}/tcg-only/junit.xml
            build/tests/runs/shard-${{ matrix.shard }}/tcg-only/summary.md
            build/tests/runs/shard-${{ matrix.shard }}/tcg-only/failed/
          if-no-files-found: warn

  # The read-only producer runs on forks as well as trusted branches. All required jobs use its image.
  image-prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # Cold candidate builds have a 100-minute step limit.
    permissions:
      contents: read
    outputs:
      key: ${{ steps.prepare.outputs.key }}
      mode: ${{ steps.prepare.outputs.mode }}
      ref: ${{ steps.prepare.outputs.ref }}
      id: ${{ steps.prepare.outputs.id }}
      checksum: ${{ steps.prepare.outputs.checksum }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Fetch or build and validate candidate
        timeout-minutes: 100
        id: prepare
        shell: bash # Fail the step when prepare fails, not just when tee fails.
        run: bash ci/image-job.sh prepare 2>&1 | tee "$RUNNER_TEMP/image-prep.log"
      # actions/upload-artifact v6
      - name: Upload preparation failure
        timeout-minutes: 2
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: image-prep-failure
          path: ${{ runner.temp }}/image-prep.log
          if-no-files-found: warn
      # actions/upload-artifact v6
      - name: Transfer candidate image
        timeout-minutes: 12
        if: steps.prepare.outputs.mode == 'archive'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-image
          path: ${{ runner.temp }}/candidate-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Publication is separate from the required read-only image handoff.
  image:
    continue-on-error: true
    needs: [image-prep, build, test]
    if: github.event_name == 'push' && github.repository == 'oriapp/RorthOX' && (github.ref == 'refs/heads/features' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # Step limits total 41 minutes.
    # A third same-input trusted push during a cold build may replace a pending publish job.
    # The next push publishes; preparation, PRs and required jobs never use this group.
    concurrency:
      group: image-${{ needs.image-prep.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.publish.outputs.ref || steps.existing.outputs.ref }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
      # actions/download-artifact v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        timeout-minutes: 5
        if: needs.image-prep.outputs.mode == 'archive'
        with:
          name: candidate-image
          path: ${{ runner.temp }}
      - name: Check archive before publication
        timeout-minutes: 10
        id: receive
        if: needs.image-prep.outputs.mode == 'archive'
        env:
          IMAGE_SHA256: ${{ needs.image-prep.outputs.checksum }}
          IMAGE_ID: ${{ needs.image-prep.outputs.id }}
        run: bash ci/image-job.sh receive
      - name: Publish only after validation
        timeout-minutes: 20
        id: publish
        if: needs.image-prep.outputs.mode == 'archive'
        env:
          IMAGE_ID: ${{ steps.receive.outputs.id }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/image-job.sh publish
      - name: Log out of registry
        timeout-minutes: 2
        if: always()
        run: docker logout ghcr.io
      - name: Record existing public digest
        timeout-minutes: 2
        id: existing
        if: needs.image-prep.outputs.mode == 'digest'
        env:
          IMAGE_REF: ${{ needs.image-prep.outputs.ref }}
        run: |
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Already public: $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
          recorded=$(grep -v '^#' ci/image.ref | head -n 1)
          if [ "$IMAGE_REF" != "$recorded" ]; then
            echo "Note: published image differs from ci/image.ref; update the recorded digest after validation." >> "$GITHUB_STEP_SUMMARY"
          fi

  result:
    needs: [select, build, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/download-artifact v6; missing artifacts are checked by ci-result.py.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        if: needs.build.result == 'success' && needs.select.outputs.mode != 'none'
        continue-on-error: true # Missing shard artifacts are marked red by the result step.
        with:
          pattern: results-*
          path: ${{ runner.temp }}/ci-results
      - name: Check every job
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          SELECT_MODE: ${{ needs.select.outputs.mode }}
          SELECT_REASON: ${{ needs.select.outputs.reason }}
          SELECT_BASE: ${{ needs.select.outputs.base }}
          SELECT_BASE_SOURCE: ${{ needs.select.outputs.base_source }}
          SELECT_TESTS: ${{ needs.select.outputs.tests }}
        run: python3 -B scripts/ci-result.py "$RUNNER_TEMP/ci-results" "$BUILD_RESULT" "$TEST_RESULT"
