name: build

on:
  push:
    branches: [main, features]
  pull_request:
  workflow_dispatch:

permissions: {}
# Never cancel a main commit's run. PRs and features keep only their newest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # Cold toolchain build on an empty cache.
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.package.outputs.manifest }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libgmp3-dev libmpc-dev \
            libmpfr-dev texinfo curl xz-utils nasm qemu-system-x86 mtools python3 \
            grub-common grub-pc-bin xorriso dosfstools
      # actions/cache v6; configure.sh is the source of the toolchain versions and options.
      - name: Cache the cross toolchain
        id: cross-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/opt/cross
          key: cross-ubuntu-24.04-${{ hashFiles('configure.sh') }}
      - name: Build the cross toolchain
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: ./configure.sh
      - name: Add the cross toolchain to PATH
        run: echo "$HOME/opt/cross/bin" >> "$GITHUB_PATH"
      - name: Build and package
        id: package
        run: |
          make all iso
          python3 -B scripts/ci-artifact.py create "$RUNNER_TEMP/production.tar.gz" "$RUNNER_TEMP/production.sha256"
          read -r manifest < "$RUNNER_TEMP/production.sha256"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      # actions/upload-artifact v6
      - name: Upload production build
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: production
          path: ${{ runner.temp }}/production.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: build-failure
          path: |
            bin/
            build/kernel.map
          if-no-files-found: ignore

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libgmp3-dev libmpc-dev \
            libmpfr-dev texinfo curl xz-utils nasm qemu-system-x86 mtools python3 \
            grub-common grub-pc-bin xorriso dosfstools
      # actions/cache v6
      - name: Cache the cross toolchain
        id: cross-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/opt/cross
          key: cross-ubuntu-24.04-${{ hashFiles('configure.sh') }}
      - name: Build the cross toolchain
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: ./configure.sh
      - name: Add the cross toolchain to PATH
        run: echo "$HOME/opt/cross/bin" >> "$GITHUB_PATH"
      # actions/download-artifact v6; defaults to an artifact of this run.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: production
          path: ${{ runner.temp }}/production
      - name: Verify and test
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest }}
          SHARD: ${{ matrix.shard }}
          RORTHOX_REQUIRE_ISO: '1'
        run: |
          python3 -B scripts/ci-artifact.py extract "$RUNNER_TEMP/production/production.tar.gz" "$MANIFEST_SHA256"
          ./scripts/run-tests.sh --shard "$SHARD/4" -j 2 --results "build/tests/runs/shard-$SHARD"
      # Upload the reports and bounded failed-only evidence, even on a red shard.
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: results-${{ matrix.shard }}
          path: |
            build/tests/runs/shard-${{ matrix.shard }}/results.json
            build/tests/runs/shard-${{ matrix.shard }}/junit.xml
            build/tests/runs/shard-${{ matrix.shard }}/summary.md
            build/tests/runs/shard-${{ matrix.shard }}/failed/
          if-no-files-found: warn

  # The read-only producer runs on forks as well as trusted branches. The required path does not wait for it.
  image-prep:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # Step limits total 116 minutes, leaving time for cleanup.
    permissions:
      contents: read
    outputs:
      key: ${{ steps.prepare.outputs.key }}
      mode: ${{ steps.prepare.outputs.mode }}
      ref: ${{ steps.prepare.outputs.ref }}
      id: ${{ steps.prepare.outputs.id }}
      checksum: ${{ steps.prepare.outputs.checksum }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Fetch or build and validate candidate
        timeout-minutes: 100
        id: prepare
        shell: bash # Fail the step when prepare fails, not just when tee fails.
        run: bash ci/image-job.sh prepare 2>&1 | tee "$RUNNER_TEMP/image-prep.log"
      # actions/upload-artifact v6
      - name: Upload preparation failure
        timeout-minutes: 2
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: image-prep-failure
          path: ${{ runner.temp }}/image-prep.log
          if-no-files-found: warn
      # actions/upload-artifact v6
      - name: Transfer candidate image
        timeout-minutes: 12
        if: steps.prepare.outputs.mode == 'archive'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-image
          path: ${{ runner.temp }}/candidate-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Only this job may write packages, and only on first-party branch pushes.
  image:
    continue-on-error: true
    needs: image-prep
    if: github.event_name == 'push' && github.repository == 'oriapp/RorthOX' && (github.ref == 'refs/heads/features' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # Step limits total 41 minutes.
    # A third same-input trusted push during a cold build may replace a pending publish job.
    # The next push publishes; preparation, PRs and required jobs never use this group.
    concurrency:
      group: image-${{ needs.image-prep.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.publish.outputs.ref || steps.existing.outputs.ref }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
      # actions/download-artifact v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        timeout-minutes: 5
        if: needs.image-prep.outputs.mode == 'archive'
        with:
          name: candidate-image
          path: ${{ runner.temp }}
      - name: Check archive before publication
        timeout-minutes: 10
        id: receive
        if: needs.image-prep.outputs.mode == 'archive'
        env:
          IMAGE_SHA256: ${{ needs.image-prep.outputs.checksum }}
          IMAGE_ID: ${{ needs.image-prep.outputs.id }}
        run: bash ci/image-job.sh receive
      - name: Publish only after validation
        timeout-minutes: 20
        id: publish
        if: needs.image-prep.outputs.mode == 'archive'
        env:
          IMAGE_ID: ${{ steps.receive.outputs.id }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/image-job.sh publish
      - name: Log out of registry
        timeout-minutes: 2
        if: always()
        run: docker logout ghcr.io
      - name: Record existing public digest
        timeout-minutes: 2
        id: existing
        if: needs.image-prep.outputs.mode == 'digest'
        env:
          IMAGE_REF: ${{ needs.image-prep.outputs.ref }}
        run: |
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Already public: $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

  # Advisory only; no dependency from result to this job.
  candidate:
    needs: image-prep
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # Step limits total 57 minutes.
    permissions:
      contents: read
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
      # actions/download-artifact v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        timeout-minutes: 3
        if: needs.image-prep.outputs.mode == 'archive'
        with:
          name: candidate-image
          path: ${{ runner.temp }}
      - name: Verify image identity
        timeout-minutes: 8
        id: image-id
        env:
          IMAGE_REF: ${{ needs.image-prep.outputs.ref }}
          IMAGE_SHA256: ${{ needs.image-prep.outputs.checksum }}
          IMAGE_ID: ${{ needs.image-prep.outputs.id }}
          IMAGE_MODE: ${{ needs.image-prep.outputs.mode }}
        run: |
          if [ "$IMAGE_MODE" = archive ]; then
            bash ci/image-job.sh receive
          elif [ "$IMAGE_MODE" = digest ]; then
            bash ci/image-job.sh fetch
          else
            exit 1
          fi
      - name: Build and test inside candidate image (TCG)
        timeout-minutes: 40
        id: suite
        env:
          RORTHOX_IMAGE_ID: ${{ steps.image-id.outputs.id }}
          RORTHOX_REQUIRE_ISO: '1'
          RORTHOX_ACCEL: tcg
        run: |
          ./ci/run.sh make all iso
          ./ci/run.sh ./scripts/run-tests.sh -j 2 --results build/tests/runs/candidate
      - name: Record certification evidence
        timeout-minutes: 2
        if: always()
        shell: bash # The tool-version pipe must preserve docker's exit status.
        env:
          IMAGE_ID: ${{ steps.image-id.outputs.id }}
          IMAGE_REF: ${{ needs.image-prep.outputs.ref }}
          IMAGE_MODE: ${{ needs.image-prep.outputs.mode }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          {
            echo '## Candidate image (advisory; required build and four shards remain authoritative)'
            echo "Suite: $SUITE_OUTCOME; source: $IMAGE_MODE; reference: ${IMAGE_REF:-not yet published}"
            if [ -n "$IMAGE_ID" ]; then
              echo "Image ID: $IMAGE_ID"
              echo "Size: $(docker image inspect --format '{{.Size}}' "$IMAGE_ID") bytes"
              for tool in 'i686-elf-gcc --version' 'x86_64-elf-gcc --version' 'nasm -v' 'qemu-system-i386 --version' 'grub-mkrescue --version' 'xorriso -version' 'python3 --version'; do
                printf '%s: ' "$tool"
                docker run --rm --network none "$IMAGE_ID" sh -c "$tool" | sed -n '1p'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # actions/upload-artifact v6
      - name: Upload candidate diagnostics
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-results
          path: |
            build/tests/runs/candidate/results.json
            build/tests/runs/candidate/junit.xml
            build/tests/runs/candidate/summary.md
            build/tests/runs/candidate/failed/
          if-no-files-found: ignore

  result:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/download-artifact v6; missing artifacts are checked by ci-result.py.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        if: needs.build.result == 'success'
        continue-on-error: true # Missing shard artifacts are marked red by the result step.
        with:
          pattern: results-*
          path: ${{ runner.temp }}/ci-results
      - name: Check every job
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: python3 -B scripts/ci-result.py "$RUNNER_TEMP/ci-results" "$BUILD_RESULT" "$TEST_RESULT"
